<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Censo Territorial Comunal • Registro por Parroquia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            venBlue: "#1e3a8a",
            venGold: "#f59e0b",
            venSky: "#0284c7"
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #060913;
    }
    .font-mono {
      font-family: "JetBrains Mono", monospace;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white pb-12">

  <!-- ============================================================== -->
  <!-- 1. CABECERA INSTITUCIONAL MÓVIL                                -->
  <!-- ============================================================== -->
  <header class="border-b border-slate-800 bg-slate-950/95 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-700 flex items-center justify-center text-white shadow-lg font-black text-sm shrink-0">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
        </div>
        <div class="truncate">
          <h1 class="text-xs sm:text-sm font-black text-white uppercase tracking-tight truncate">
            Censo Comunal Monagas
          </h1>
          <div class="flex items-center gap-1.5 text-[11px] font-bold text-sky-400 truncate">
            <i data-lucide="map-pin" class="w-3 h-3 shrink-0"></i>
            <span id="header-parish-title" class="truncate">Cargando territorio...</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <span id="cloud-status-badge" class="px-2 py-1 rounded-lg text-[10px] font-mono font-bold bg-slate-900 border border-slate-800 text-slate-400 flex items-center gap-1">
          <span id="cloud-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="cloud-text">Conectando</span>
        </span>
      </div>
    </div>
  </header>

  <!-- ============================================================== -->
  <!-- 2. CONTENIDO PRINCIPAL: FORMULARIO Y LISTADO                   -->
  <!-- ============================================================== -->
  <main class="flex-1 max-w-xl mx-auto w-full px-4 py-4 space-y-4">

    <!-- Tarjeta de Resumen Territorial de la Parroquia -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-lg space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="text-slate-400 font-bold uppercase tracking-wider text-[10px]">Totales Registrados en Parroquia</span>
        <span id="badge-total-sectors" class="font-mono text-sky-400 font-black">0 Sectores</span>
      </div>

      <div class="grid grid-cols-4 gap-2 text-center font-mono">
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800/80">
          <span class="text-[9px] uppercase font-bold text-amber-400 block">Casas</span>
          <strong id="kpi-casas" class="text-sm sm:text-base font-black text-white">0</strong>
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800/80">
          <span class="text-[9px] uppercase font-bold text-sky-400 block">Familias</span>
          <strong id="kpi-familias" class="text-sm sm:text-base font-black text-white">0</strong>
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800/80">
          <span class="text-[9px] uppercase font-bold text-emerald-400 block">Habitantes</span>
          <strong id="kpi-habitantes" class="text-sm sm:text-base font-black text-white">0</strong>
        </div>
        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800/80">
          <span class="text-[9px] uppercase font-bold text-purple-400 block">Votantes</span>
          <strong id="kpi-votantes" class="text-sm sm:text-base font-black text-white">0</strong>
        </div>
      </div>
    </div>

    <!-- TARJETA DEL FORMULARIO DE CARGA -->
    <div class="bg-slate-900 border-2 border-emerald-500/40 rounded-3xl p-4 sm:p-5 shadow-2xl space-y-4 relative">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-950 border border-emerald-500/50 flex items-center justify-center text-emerald-400">
            <i id="form-mode-icon" data-lucide="plus" class="w-4 h-4"></i>
          </div>
          <h2 id="form-mode-title" class="text-xs sm:text-sm font-black text-white uppercase tracking-wider">
            Registrar Sector Comunal
          </h2>
        </div>
        <button type="button" id="btn-cancel-edit" class="hidden px-2.5 py-1 text-[11px] font-bold text-slate-400 hover:text-white bg-slate-800 border border-slate-700 rounded-lg">
          Cancelar Edición
        </button>
      </div>

      <form id="form-sector" class="space-y-3.5">
        <input type="hidden" id="field-editing-id" value="">

        <!-- Campo 1: Eje Comunal / Sub-Parroquia -->
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-300 mb-1 flex items-center justify-between">
            <span>Eje Comunal / Sub-Parroquia *</span>
            <span class="text-[10px] text-purple-400 font-mono">Nivel 4</span>
          </label>
          <select id="select-eje" required class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs font-bold focus:outline-none focus:border-emerald-500 cursor-pointer">
            <option value="">-- Seleccione el Eje Comunal --</option>
            <!-- Inyectado dinámicamente -->
            <option value="__nuevo__">➕ Crear / Escribir Nuevo Eje...</option>
          </select>
        </div>

        <!-- Input adicional si seleccionó "+ Crear Nuevo Eje" -->
        <div id="wrapper-nuevo-eje" class="hidden">
          <label class="block text-[10px] font-bold uppercase text-purple-400 mb-1">
            Nombre del Nuevo Eje Comunal:
          </label>
          <input type="text" id="input-nuevo-eje" placeholder="Ej: Eje Comunal 4 • La Victoria" class="w-full px-3.5 py-2.5 bg-slate-950 border border-purple-500/60 rounded-xl text-white text-xs font-medium focus:outline-none focus:border-purple-400">
        </div>

        <!-- Campo 2: Nombre del Sector / Comunidad -->
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-300 mb-1 flex items-center justify-between">
            <span>Nombre del Sector o Comunidad *</span>
            <span class="text-[10px] text-sky-400 font-mono">Capa 5</span>
          </label>
          <input type="text" id="input-sector-nombre" required placeholder="Ej: Sector Las Brisas, Calle 3, La Muralla..." class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs sm:text-sm font-semibold focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Campos Numéricos 2x2 -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <!-- Casas -->
          <div>
            <label class="block text-[10px] font-bold uppercase text-amber-400 mb-1">
              🏠 Número de Casas *
            </label>
            <input type="number" id="input-casas" required min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-center font-mono font-black text-sm focus:outline-none focus:border-amber-500">
          </div>

          <!-- Familias -->
          <div>
            <label class="block text-[10px] font-bold uppercase text-sky-400 mb-1">
              👨‍👩‍👧 Familias *
            </label>
            <input type="number" id="input-familias" required min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-center font-mono font-black text-sm focus:outline-none focus:border-sky-500">
          </div>

          <!-- Habitantes -->
          <div>
            <label class="block text-[10px] font-bold uppercase text-emerald-400 mb-1">
              👥 Habitantes Totales *
            </label>
            <input type="number" id="input-habitantes" required min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-center font-mono font-black text-sm focus:outline-none focus:border-emerald-500">
          </div>

          <!-- Votantes -->
          <div>
            <label class="block text-[10px] font-bold uppercase text-purple-400 mb-1">
              🗳️ Votantes Estimados
            </label>
            <input type="number" id="input-votantes" min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-center font-mono font-black text-sm focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <!-- Campo Opcional: Centro de Votación Referencial -->
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">
            🏫 Centro de Votación / Escuela de Referencia (Opcional):
          </label>
          <input type="text" id="input-centro-ref" placeholder="Ej: Escuela Básica San Simón" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-slate-300 text-xs focus:outline-none focus:border-sky-500">
        </div>

        <!-- Botón Guardar -->
        <button type="submit" id="btn-submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 active:scale-95 cursor-pointer mt-3">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span id="btn-submit-text">Guardar Sector Comunal</span>
        </button>
      </form>

    </div>

    <!-- TARJETA: LISTADO DE SECTORES CARGADOS EN ESTA PARROQUIA -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-5 space-y-3">
      
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="list" class="w-4 h-4 text-sky-400"></i>
          <h3 class="text-xs sm:text-sm font-black text-white uppercase tracking-wider">
            Sectores Cargados
          </h3>
        </div>
        <span id="list-counter-badge" class="px-2 py-0.5 rounded-lg text-[10px] font-mono font-bold bg-slate-950 text-slate-300 border border-slate-800">
          0 registros
        </span>
      </div>

      <!-- Buscador rápido de sectores -->
      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="input-search-sectors" placeholder="Buscar en la lista..." class="w-full pl-8 pr-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500">
      </div>

      <!-- Contenedor del Listado -->
      <div id="sectors-list-container" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
        <!-- Generado dinámicamente con JS -->
      </div>

    </div>

  </main>

  <!-- TOAST DE NOTIFICACIÓN FLOTANTE -->
  <div id="toast" class="fixed bottom-4 inset-x-4 max-w-sm mx-auto z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 border-2 border-emerald-500/80 rounded-2xl p-3 shadow-2xl flex items-center gap-2.5 text-white font-bold text-xs">
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i>
      <span id="toast-text" class="flex-1 truncate">Datos guardados con éxito</span>
    </div>
  </div>

  <!-- SCRIPT DE APLICACIÓN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      onSnapshot,
      enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import { CATALOGO_MONAGAS } from "../earth-monagas/js/catalogoMonagas.js?v=90";
    import { SUBPARROQUIAS_GODOS, SECTORES_LAPUENTE } from "../earth-monagas/js/geoMonagas.js?v=90";
    import { DEFAULT_SAN_SIMON_SUBPARROQUIAS, DEFAULT_COROZO_SUBPARROQUIAS } from "../earth-monagas/js/earthStore.js?v=90";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCK8DBZWsVflfMoA_z-9XupX0BvLE4iJjc",
      authDomain: "gato-3e238.firebaseapp.com",
      projectId: "gato-3e238",
      storageBucket: "gato-3e238.firebasestorage.app",
      messagingSenderId: "630890915824",
      appId: "1:630890915824:web:bc0deb7f80c4494b78df35",
      measurementId: "G-G1617P2MM0"
    };

    class CargaParroquiaApp {
      constructor() {
        this.munId = "maturin";
        this.parishId = "san-simon";
        this.parishNombre = "San Simón";
        this.munNombre = "Maturín";
        this.subparroquias = [];
        this.poligonos = [];
        this.searchQuery = "";
        this.editingSectorId = null;

        this.db = null;
        this.unsubscribeFirestore = null;

        this.resolveParishFromUrl();
        this.initFirebase();
        this.bindEvents();
        this.renderAll();
      }

      resolveParishFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const pId = params.get("p") || params.get("parroquia") || params.get("parish") || "san-simon";
        
        let found = false;
        for (const mun of CATALOGO_MONAGAS) {
          for (const p of mun.parroquias) {
            if (p.id === pId || p.nombre.toLowerCase().includes(pId.toLowerCase())) {
              this.munId = mun.id;
              this.parishId = p.id;
              this.parishNombre = p.nombre;
              this.munNombre = mun.nombre;
              found = true;
              break;
            }
          }
          if (found) break;
        }

        document.title = `Censo • Parroquia ${this.parishNombre} (${this.munNombre})`;
        const headerTitle = document.getElementById("header-parish-title");
        if (headerTitle) {
          headerTitle.textContent = `${this.parishNombre} • ${this.munNombre}`;
        }
      }

      get docId() {
        return `${this.munId}_${this.parishId}`;
      }

      initFirebase() {
        try {
          const app = initializeApp(FIREBASE_CONFIG, "CARGA_PARROQUIA_APP");
          this.db = getFirestore(app);
          try { enableIndexedDbPersistence(this.db).catch(() => {}); } catch(e) {}

          this.updateCloudBadge(true, "Conectando");

          const docRef = doc(this.db, "territorios_monagas", this.docId);
          this.unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
              let data = docSnap.data();
              if (data.dataJson && typeof data.dataJson === "string") {
                try {
                  const parsed = JSON.parse(data.dataJson);
                  data = { ...data, ...parsed };
                } catch(e) {}
              }
              this.subparroquias = data.subparroquias || [];
              this.poligonos = data.poligonos || [];
            } else {
              this.loadDefaultFallback();
            }
            this.syncWithLocalStorage();
            this.renderAll();
            this.updateCloudBadge(true, "En Línea");
          }, (err) => {
            console.warn("Aviso Firestore:", err);
            this.fallbackToLocalStorage();
          });
        } catch (e) {
          console.warn("Error Firebase:", e);
          this.fallbackToLocalStorage();
        }
      }

      loadDefaultFallback() {
        if (this.munId === "maturin" && this.parishId === "alto-de-los-godos") {
          this.subparroquias = JSON.parse(JSON.stringify(SUBPARROQUIAS_GODOS || []));
          this.poligonos = JSON.parse(JSON.stringify(SECTORES_LAPUENTE || []));
        } else if (this.munId === "maturin" && this.parishId === "san-simon") {
          this.subparroquias = JSON.parse(JSON.stringify(DEFAULT_SAN_SIMON_SUBPARROQUIAS || []));
          this.poligonos = [];
        } else if (this.munId === "maturin" && this.parishId === "el-corozo") {
          this.subparroquias = JSON.parse(JSON.stringify(DEFAULT_COROZO_SUBPARROQUIAS || []));
          this.poligonos = [];
        } else {
          // Si no tiene predeterminados, crear 1 eje base
          this.subparroquias = [
            {
              id: `sub-${this.parishId}-1`,
              parroquiaId: this.parishId,
              nombre: `Eje 1 • Casco ${this.parishNombre}`,
              alias: `Eje Central`
            }
          ];
          this.poligonos = [];
        }
      }

      fallbackToLocalStorage() {
        this.updateCloudBadge(false, "Modo Local");
        try {
          const raw = localStorage.getItem("earth_monagas_places_v8");
          if (raw) {
            const parsed = JSON.parse(raw);
            const p = parsed?.municipios?.[this.munId]?.parroquias?.[this.parishId];
            if (p) {
              this.subparroquias = p.subparroquias || [];
              this.poligonos = p.poligonos || [];
              this.renderAll();
              return;
            }
          }
        } catch(e) {}
        this.loadDefaultFallback();
        this.renderAll();
      }

      syncWithLocalStorage() {
        try {
          let root = {};
          const raw = localStorage.getItem("earth_monagas_places_v8");
          if (raw) root = JSON.parse(raw);
          if (!root.municipios) root.municipios = {};
          if (!root.municipios[this.munId]) root.municipios[this.munId] = { id: this.munId, parroquias: {} };
          if (!root.municipios[this.munId].parroquias) root.municipios[this.munId].parroquias = {};
          
          root.municipios[this.munId].parroquias[this.parishId] = {
            id: this.parishId,
            nombre: this.parishNombre,
            subparroquias: this.subparroquias,
            poligonos: this.poligonos,
            updatedAt: Date.now()
          };

          localStorage.setItem("earth_monagas_places_v8", JSON.stringify(root));
        } catch(e) {}
      }

      async saveToCloud() {
        this.syncWithLocalStorage();
        if (this.db) {
          try {
            const docRef = doc(this.db, "territorios_monagas", this.docId);
            const payload = {
              munId: this.munId,
              parishId: this.parishId,
              nombre: this.parishNombre,
              subparroquias: this.subparroquias,
              poligonos: this.poligonos,
              updatedAt: Date.now(),
              dataJson: JSON.stringify({
                munId: this.munId,
                parishId: this.parishId,
                nombre: this.parishNombre,
                subparroquias: this.subparroquias,
                poligonos: this.poligonos,
                updatedAt: Date.now()
              })
            };
            await setDoc(docRef, payload, { merge: true });
            this.updateCloudBadge(true, "Guardado");
          } catch(e) {
            console.warn("Error guardando en Firestore:", e);
            this.updateCloudBadge(false, "Guardado Local");
          }
        }
      }

      updateCloudBadge(isOnline, text) {
        const dot = document.getElementById("cloud-dot");
        const txt = document.getElementById("cloud-text");
        if (!dot || !txt) return;
        txt.textContent = text;
        if (isOnline) {
          dot.className = "w-2 h-2 rounded-full bg-emerald-400";
        } else {
          dot.className = "w-2 h-2 rounded-full bg-amber-400";
        }
      }

      showToast(msg) {
        const toast = document.getElementById("toast");
        const text = document.getElementById("toast-text");
        if (!toast || !text) return;
        text.textContent = msg;
        toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
        setTimeout(() => {
          toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
        }, 3000);
      }

      bindEvents() {
        const form = document.getElementById("form-sector");
        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            this.handleSubmitForm();
          });
        }

        const selectEje = document.getElementById("select-eje");
        const wrapperNuevo = document.getElementById("wrapper-nuevo-eje");
        const inputNuevoEje = document.getElementById("input-nuevo-eje");
        if (selectEje && wrapperNuevo) {
          selectEje.addEventListener("change", (e) => {
            if (e.target.value === "__nuevo__") {
              wrapperNuevo.classList.remove("hidden");
              if (inputNuevoEje) inputNuevoEje.focus();
            } else {
              wrapperNuevo.classList.add("hidden");
            }
          });
        }

        // Auto-sugerir familias al escribir casas
        const inCasas = document.getElementById("input-casas");
        const inFamilias = document.getElementById("input-familias");
        if (inCasas && inFamilias) {
          inCasas.addEventListener("input", () => {
            if (!inFamilias.value && inCasas.value) {
              inFamilias.value = inCasas.value;
            }
          });
        }

        const btnCancel = document.getElementById("btn-cancel-edit");
        if (btnCancel) {
          btnCancel.addEventListener("click", () => this.cancelEditing());
        }

        const inputSearch = document.getElementById("input-search-sectors");
        if (inputSearch) {
          inputSearch.addEventListener("input", (e) => {
            this.searchQuery = e.target.value;
            this.renderSectorsList();
          });
        }
      }

      handleSubmitForm() {
        const selectEje = document.getElementById("select-eje");
        const inputNuevoEje = document.getElementById("input-nuevo-eje");
        const inputNombre = document.getElementById("input-sector-nombre");
        const inputCasas = document.getElementById("input-casas");
        const inputFamilias = document.getElementById("input-familias");
        const inputHabitantes = document.getElementById("input-habitantes");
        const inputVotantes = document.getElementById("input-votantes");
        const inputCentroRef = document.getElementById("input-centro-ref");

        let ejeId = selectEje.value;
        if (ejeId === "__nuevo__") {
          const nuevoNombre = (inputNuevoEje.value || "").trim();
          if (!nuevoNombre) {
            alert("Por favor escribe el nombre del nuevo Eje Comunal.");
            return;
          }
          ejeId = `sub-${this.parishId}-${Date.now()}`;
          this.subparroquias.push({
            id: ejeId,
            parroquiaId: this.parishId,
            nombre: nuevoNombre,
            alias: nuevoNombre
          });
        }

        const nombre = (inputNombre.value || "").trim();
        const casas = parseInt(inputCasas.value, 10) || 0;
        const familias = parseInt(inputFamilias.value, 10) || casas;
        const habitantes = parseInt(inputHabitantes.value, 10) || 0;
        const votantes = parseInt(inputVotantes.value, 10) || 0;
        const centroRef = (inputCentroRef?.value || "").trim();

        if (!nombre) {
          alert("Ingresa el nombre del sector.");
          return;
        }

        if (this.editingSectorId) {
          // Edición
          const sec = this.poligonos.find(p => p.id === this.editingSectorId);
          if (sec) {
            sec.nombre = nombre;
            sec.subParroquiaId = ejeId;
            sec.casas = casas;
            sec.familias = familias;
            sec.habitantes = habitantes;
            sec.militantes = votantes;
            sec.centroVotacion = centroRef;
          }
          this.showToast(`✓ Sector "${nombre}" actualizado`);
        } else {
          // Nuevo
          const newId = `sec-${this.parishId}-${Date.now()}`;
          this.poligonos.push({
            id: newId,
            parroquiaId: this.parishId,
            subParroquiaId: ejeId,
            nombre: nombre,
            casas: casas,
            familias: familias,
            habitantes: habitantes,
            militantes: votantes,
            centroVotacion: centroRef,
            tipo: "sector",
            visible: true
          });
          this.showToast(`✓ Sector "${nombre}" registrado`);
        }

        this.saveToCloud();
        this.cancelEditing();
        this.renderAll();
      }

      startEditSector(sectorId) {
        const sec = this.poligonos.find(p => p.id === sectorId);
        if (!sec) return;

        this.editingSectorId = sec.id;

        document.getElementById("field-editing-id").value = sec.id;
        document.getElementById("form-mode-title").textContent = `Editar: ${sec.nombre}`;
        document.getElementById("btn-submit-text").textContent = "Guardar Cambios";
        document.getElementById("btn-cancel-edit").classList.remove("hidden");

        const selectEje = document.getElementById("select-eje");
        selectEje.value = sec.subParroquiaId || "";

        document.getElementById("input-sector-nombre").value = sec.nombre || "";
        document.getElementById("input-casas").value = sec.casas || 0;
        document.getElementById("input-familias").value = sec.familias || sec.casas || 0;
        document.getElementById("input-habitantes").value = sec.habitantes || 0;
        document.getElementById("input-votantes").value = sec.militantes !== undefined ? sec.militantes : 0;
        document.getElementById("input-centro-ref").value = sec.centroVotacion || "";

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      cancelEditing() {
        this.editingSectorId = null;
        document.getElementById("form-sector").reset();
        document.getElementById("field-editing-id").value = "";
        document.getElementById("wrapper-nuevo-eje").classList.add("hidden");
        document.getElementById("form-mode-title").textContent = "Registrar Sector Comunal";
        document.getElementById("btn-submit-text").textContent = "Guardar Sector Comunal";
        document.getElementById("btn-cancel-edit").classList.add("hidden");
      }

      deleteSector(sectorId) {
        const sec = this.poligonos.find(p => p.id === sectorId);
        if (!sec) return;
        if (!confirm(`¿Eliminar el sector "${sec.nombre}"?`)) return;

        this.poligonos = this.poligonos.filter(p => p.id !== sectorId);
        if (this.editingSectorId === sectorId) {
          this.cancelEditing();
        }
        this.saveToCloud();
        this.renderAll();
        this.showToast(`Sector "${sec.nombre}" eliminado`);
      }

      renderAll() {
        this.renderEjesSelector();
        this.renderKPIs();
        this.renderSectorsList();
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      renderEjesSelector() {
        const select = document.getElementById("select-eje");
        if (!select) return;

        const currentVal = select.value;
        let html = '<option value="">-- Seleccione el Eje Comunal --</option>';

        this.subparroquias.forEach(eje => {
          html += `<option value="${eje.id}">${eje.nombre || eje.alias || 'Eje Comunal'}</option>`;
        });

        html += '<option value="__nuevo__">➕ Crear / Escribir Nuevo Eje...</option>';
        select.innerHTML = html;

        if (currentVal && select.querySelector(`option[value="${currentVal}"]`)) {
          select.value = currentVal;
        }
      }

      renderKPIs() {
        let totCasas = 0;
        let totFamilias = 0;
        let totHabitantes = 0;
        let totVotantes = 0;

        this.poligonos.forEach(s => {
          totCasas += (parseInt(s.casas, 10) || 0);
          totFamilias += (parseInt(s.familias, 10) || parseInt(s.casas, 10) || 0);
          totHabitantes += (parseInt(s.habitantes, 10) || 0);
          totVotantes += (parseInt(s.militantes, 10) || 0);
        });

        document.getElementById("kpi-casas").textContent = totCasas.toLocaleString();
        document.getElementById("kpi-familias").textContent = totFamilias.toLocaleString();
        document.getElementById("kpi-habitantes").textContent = totHabitantes.toLocaleString();
        document.getElementById("kpi-votantes").textContent = totVotantes.toLocaleString();
        
        const countStr = `${this.poligonos.length} Sectores`;
        document.getElementById("badge-total-sectors").textContent = countStr;
        document.getElementById("list-counter-badge").textContent = `${this.poligonos.length} registrados`;
      }

      renderSectorsList() {
        const container = document.getElementById("sectors-list-container");
        if (!container) return;

        const q = (this.searchQuery || "").toLowerCase().trim();
        const filtered = this.poligonos.filter(s => {
          if (!q) return true;
          return (s.nombre || "").toLowerCase().includes(q) ||
                 (s.centroVotacion || "").toLowerCase().includes(q);
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="py-8 text-center text-slate-500 bg-slate-950/60 rounded-2xl border border-slate-800">
              <i data-lucide="inbox" class="w-7 h-7 mx-auto mb-1.5 text-slate-600"></i>
              <p class="text-xs font-bold">No hay sectores registrados ${q ? 'con esa búsqueda' : 'aún'}</p>
              <p class="text-[10px] text-slate-600 mt-0.5">Usa el formulario de arriba para cargar el primero</p>
            </div>
          `;
          if (window.lucide) window.lucide.createIcons();
          return;
        }

        // Mapa de nombres de ejes
        const ejesMap = {};
        this.subparroquias.forEach(e => {
          ejesMap[e.id] = e.nombre || e.alias || 'Eje Comunal';
        });

        container.innerHTML = filtered.map(s => {
          const ejeNombre = ejesMap[s.subParroquiaId] || "(Sin Eje Asignado)";
          const casas = s.casas || 0;
          const familias = s.familias || s.casas || 0;
          const habitantes = s.habitantes || 0;
          const votantes = s.militantes !== undefined ? s.militantes : 0;

          return `
            <div class="p-3 bg-slate-950/90 border border-slate-800/90 rounded-2xl space-y-2 hover:border-slate-700 transition">
              
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <span class="text-[10px] font-bold text-purple-400 font-mono block truncate">
                    ${ejeNombre}
                  </span>
                  <h4 class="text-xs sm:text-sm font-black text-white leading-tight mt-0.5">
                    ${s.nombre}
                  </h4>
                  ${s.centroVotacion ? `
                    <span class="text-[10px] text-slate-400 font-medium block truncate mt-0.5">
                      🏫 ${s.centroVotacion}
                    </span>
                  ` : ''}
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" onclick="window.cargaApp.startEditSector('${s.id}')" class="p-2 bg-slate-900 hover:bg-sky-950 border border-slate-700 text-sky-400 rounded-xl transition active:scale-95 cursor-pointer" title="Editar sector">
                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                  </button>
                  <button type="button" onclick="window.cargaApp.deleteSector('${s.id}')" class="p-2 bg-slate-900 hover:bg-rose-950 border border-slate-700 text-rose-400 rounded-xl transition active:scale-95 cursor-pointer" title="Eliminar sector">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>

              <!-- Badges de métricas numéricas -->
              <div class="grid grid-cols-4 gap-1.5 text-center font-mono text-[10px] pt-1 border-t border-slate-900">
                <div class="bg-slate-900/80 p-1.5 rounded-lg border border-slate-800">
                  <span class="text-[8px] text-amber-400 block font-bold">CASAS</span>
                  <strong class="text-white font-black">${casas}</strong>
                </div>
                <div class="bg-slate-900/80 p-1.5 rounded-lg border border-slate-800">
                  <span class="text-[8px] text-sky-400 block font-bold">FAM.</span>
                  <strong class="text-white font-black">${familias}</strong>
                </div>
                <div class="bg-slate-900/80 p-1.5 rounded-lg border border-slate-800">
                  <span class="text-[8px] text-emerald-400 block font-bold">HAB.</span>
                  <strong class="text-white font-black">${habitantes}</strong>
                </div>
                <div class="bg-slate-900/80 p-1.5 rounded-lg border border-slate-800">
                  <span class="text-[8px] text-purple-400 block font-bold">VOT.</span>
                  <strong class="text-white font-black">${votantes}</strong>
                </div>
              </div>

            </div>
          `;
        }).join("");

        if (window.lucide) window.lucide.createIcons();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      window.cargaApp = new CargaParroquiaApp();
    });
  </script>

</body>
</html>
