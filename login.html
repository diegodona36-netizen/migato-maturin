<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acceso</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Anti-Caché Estricto -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tailwind CSS -->
  <script src="vendor/tailwindcss.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: "#1e1b4b",
              accent: "#4338ca"
            }
          },
          fontFamily: {
            sans: ["system-ui", "-apple-system", "BlinkMacSystemFont", "'Segoe UI'", "Roboto", "sans-serif"]
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="vendor/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>

  <style>
    body {
      background-color: #090d16;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-200 antialiased selection:bg-indigo-600 selection:text-white">

  <!-- Caja Minimalista Discreta -->
  <div class="w-full max-w-sm bg-[#0e1424] border border-slate-800 rounded-2xl p-6 sm:p-7 shadow-2xl relative">
    
    <!-- Encabezado Neutro -->
    <div class="text-center mb-6 space-y-1">
      <div class="w-10 h-10 mx-auto rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-300 mb-3">
        <i data-lucide="lock" class="w-5 h-5"></i>
      </div>
      <h1 class="text-lg font-bold text-white tracking-tight">
        Iniciar Sesión
      </h1>
      <p class="text-xs text-slate-400">
        Ingrese sus credenciales para continuar
      </p>
    </div>

    <!-- Mensaje de Error Discreto -->
    <div id="login-error" class="hidden mb-4 p-2.5 rounded-lg bg-red-500/10 border border-red-500/20 text-red-300 text-xs font-medium text-center">
      <span id="login-error-msg">Credenciales incorrectas.</span>
    </div>

    <!-- Formulario Limpio -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1" for="username">
          Usuario
        </label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username"
          placeholder="Usuario"
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#090d16] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1" for="password">
          Contraseña
        </label>
        <div class="relative">
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="Contraseña"
            class="w-full pl-3.5 pr-10 py-2.5 rounded-xl bg-[#090d16] border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 transition cursor-pointer">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit"
        class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition shadow-sm active:scale-98 cursor-pointer mt-2">
        Entrar
      </button>
    </form>

  </div>

  <script src="js/auth.js?v=sec_reset_20260925_urgente"></script>
  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }

    function getRedirectTarget() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      return redirect ? decodeURIComponent(redirect) : 'index.html';
    }

    if (MIGATO_AUTH.isAuthenticated()) {
      window.location.replace(getRedirectTarget());
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwd.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      const msgEl = document.getElementById('login-error-msg');
      if (el && msgEl) {
        msgEl.textContent = msg || "Credenciales incorrectas.";
        el.classList.remove('hidden');
      }
    }

    function hideError() {
      const el = document.getElementById('login-error');
      if (el) el.classList.add('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      hideError();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const res = MIGATO_AUTH.authenticate(user, pass);
      if (res.success) {
        window.location.replace(getRedirectTarget());
      } else {
        showError("Credenciales incorrectas.");
      }
    });
  </script>
</body>
</html>
