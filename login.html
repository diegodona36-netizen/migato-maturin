<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIGATO • Acceso a Central de Mando</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo-migato.png">

  <!-- Anti-Caché Estricto -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tailwind CSS -->
  <script src="vendor/tailwindcss.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            migato: {
              brand: "#23176d",
              light: "#35249c",
              surface: "#0e1122"
            }
          },
          fontFamily: {
            sans: ["system-ui", "-apple-system", "BlinkMacSystemFont", "'Segoe UI'", "Roboto", "sans-serif"]
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="vendor/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>

  <style>
    body {
      background-color: #080b14;
      background-image: radial-gradient(circle at 50% 30%, rgba(35, 23, 109, 0.45) 0%, rgba(8, 11, 20, 1) 75%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 antialiased selection:bg-[#23176d] selection:text-white">

  <!-- Tarjeta Central MIGATO -->
  <div class="w-full max-w-sm bg-[#100c2e]/90 border border-white/15 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative">
    
    <!-- Encabezado Institucional Equilibrado con Logo del Gato -->
    <div class="text-center mb-6 space-y-2">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-[#1b124e] border border-white/20 p-1.5 shadow-lg flex items-center justify-center">
        <img src="assets/logo-migato.png" alt="MIGATO" class="w-full h-full object-contain">
      </div>
      <div>
        <span class="text-[10px] sm:text-[11px] font-bold tracking-wider text-slate-300 uppercase block">
          MOVIMIENTO INDEPENDIENTE GANAMOS TODOS
        </span>
        <h1 class="text-lg sm:text-xl font-black text-white uppercase tracking-tight mt-1">
          ACCESO A CENTRAL DE MANDO
        </h1>
      </div>
    </div>

    <!-- Mensaje de Error Discreto -->
    <div id="login-error" class="hidden mb-4 p-2.5 rounded-xl bg-rose-500/20 border border-rose-500/30 text-rose-200 text-xs font-semibold text-center">
      <span id="login-error-msg">Credenciales no reconocidas en el sistema.</span>
    </div>

    <!-- Formulario Limpio y Formal -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5" for="username">
          Usuario o Cédula:
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="user" class="w-4 h-4"></i>
          </span>
          <input type="text" id="username" name="username" required autofocus autocomplete="username"
            placeholder="Ingrese su usuario o cédula"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#181142] border border-white/20 text-white placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400/40 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5" for="password">
          Contraseña de Seguridad:
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </span>
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="••••••••••••"
            class="w-full pl-10 pr-11 py-2.5 rounded-xl bg-[#181142] border border-white/20 text-white placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400/40 transition">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition cursor-pointer">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit"
        class="w-full py-3 px-4 rounded-xl bg-[#1e1554] hover:bg-[#2b1e77] text-white font-bold text-xs sm:text-sm uppercase tracking-wider border border-white/20 hover:border-white/40 transition shadow-lg shadow-black/40 active:scale-98 flex items-center justify-center gap-2 cursor-pointer mt-3">
        <i data-lucide="log-in" class="w-4 h-4 text-blue-300"></i>
        <span>INGRESAR A CENTRAL DE MANDO</span>
      </button>
    </form>

  </div>

  <script src="js/auth.js?v=sec_reset_20260925_urgente"></script>
  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }

    function getRedirectTarget() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      return redirect ? decodeURIComponent(redirect) : 'index.html';
    }

    if (MIGATO_AUTH.isAuthenticated()) {
      window.location.replace(getRedirectTarget());
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwd.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      const msgEl = document.getElementById('login-error-msg');
      if (el && msgEl) {
        msgEl.textContent = msg || "Credenciales no reconocidas en el sistema.";
        el.classList.remove('hidden');
      }
    }

    function hideError() {
      const el = document.getElementById('login-error');
      if (el) el.classList.add('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      hideError();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const res = MIGATO_AUTH.authenticate(user, pass);
      if (res.success) {
        window.location.replace(getRedirectTarget());
      } else {
        showError("Credenciales no reconocidas en el sistema.");
      }
    });
  </script>
</body>
</html>
